# Phase 1.5 smoke — 3-match tournament, rising blinds, all via OpenRouter.
#
# 6 LLMs + 1 stub.  Each match plays up to 200 hands with a 5-level rising
# blind schedule.  Stacks reset between matches; final_score = sum of
# per-match final stacks across the 3 matches.  No rebuys within a match.
#
# Set in .env (gitignored) at the repo root:
#   OPENROUTER_API_KEY=sk-or-...
#
# Run:
#   uv run holdembench run --config evals/smoke-openrouter-only.yaml --seed 2026 --real-time

tournament_id: smoke-1match-2026-05-07
# Anthropic Haiku 4.5 sat out: needs 4096-token minimum for prompt caching;
# our prompt is ~334 tokens and we are not padding it (would contaminate
# the benchmark with strategy hints).  Uncached Haiku would dominate cost.
seats:
  Seat1: openrouter:google/gemini-2.5-flash         # Google (thinking)
  Seat2: openrouter:deepseek/deepseek-chat-v3.1     # DeepSeek (thinking)
  Seat3: openrouter:qwen/qwen3-32b                  # Qwen (thinking)
  Seat4: openrouter:x-ai/grok-3-mini                # xAI (thinking-by-default)
  Seat5: openrouter:openai/gpt-4o-mini              # OpenAI (no thinking, 128K ctx)
  Seat6: stub:gto_approx                            # solver anchor

# Defaults (used when blind_levels is empty); all matches start at level 1.
small_blind: 10
big_blind: 20
ante: 0
starting_stack: 1000

# Single-match audit run (will resume to 3-match config after log audit).
hand_cap: 200
session_count: 1

master_seed: 2026
reasoning_effort: medium

# Rising-stakes ladder: blinds double every 40 hands within each match.
blind_levels:
  - { start_hand: 1,   small_blind: 10,  big_blind: 20  }
  - { start_hand: 41,  small_blind: 20,  big_blind: 40  }
  - { start_hand: 81,  small_blind: 40,  big_blind: 80  }
  - { start_hand: 121, small_blind: 80,  big_blind: 160 }
  - { start_hand: 161, small_blind: 160, big_blind: 320 }

# Per-match cost ceilings; total summed across 3 matches.
budget_ceilings_usd:
  openrouter:google/gemini-2.5-flash: 6.00
  openrouter:deepseek/deepseek-chat-v3.1: 4.00
  openrouter:qwen/qwen3-32b: 2.00
  openrouter:x-ai/grok-3-mini: 4.00
  openrouter:openai/gpt-4o-mini: 1.50
  stub:gto_approx: 0.01
